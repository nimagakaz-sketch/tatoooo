<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tattoo Studio | Запись</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #f5f5f7;
            --hint-color: #8e8e93;
            --accent-red: #c51d24;
            --card-bg: rgba(20, 20, 20, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
        
        body {
            background-color: var(--bg-color);
            /* Текстура советского ковра на заднем фоне с затемнением */
            background-image: linear-gradient(rgba(13, 13, 13, 0.88), rgba(13, 13, 13, 0.88)), url('https://images.unsplash.com/photo-1544457070-4cd773b4d71e?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            padding: 16px;
            min-height: 100vh;
        }

        .container { max-width: 480px; width: 100%; margin: 0 auto; padding-bottom: 40px; }

        /* Навигация (вкладки) */
        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--hint-color);
            font-size: 13px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .tab-btn.active {
            background: var(--accent-red);
            color: #fff;
            box-shadow: 0 4px 15px rgba(197, 29, 36, 0.4);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 22px; font-weight: 700; color: #fff; text-transform: uppercase; text-shadow: 0 2px 10px rgba(197, 29, 36, 0.4); }
        .header p { font-size: 13px; color: var(--hint-color); margin-top: 4px; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            margin-bottom: 16px;
        }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: 600; color: var(--hint-color); margin-bottom: 6px; text-transform: uppercase; }
        
        input, textarea {
            width: 100%; padding: 12px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 12px; color: var(--text-color);
            font-size: 15px; outline: none; transition: all 0.3s;
        }
        input:focus, textarea:focus { border-color: var(--accent-red); box-shadow: 0 0 0 3px rgba(197, 29, 36, 0.25); }

        .file-upload-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px; color: var(--text-color); font-size: 14px; cursor: pointer;
        }
        input[type="file"] { display: none; }
        .file-name { font-size: 12px; color: var(--hint-color); margin-top: 6px; text-align: center; }

        .submit-btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #e52d27 0%, #b31217 100%);
            color: #fff; border: none; border-radius: 14px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 20px rgba(197, 29, 36, 0.4); text-transform: uppercase;
        }

        /* Галерея работ и отзывы */
        .grid-gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .gallery-item { border-radius: 12px; overflow: hidden; height: 160px; background: #222; border: 1px solid var(--border-color); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        
        .review-card { background: rgba(0,0,0,0.4); padding: 14px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border-color); }
        .review-author { font-weight: 600; font-size: 13px; color: var(--accent-red); margin-bottom: 4px; }
        .review-text { font-size: 13px; color: #ddd; }

        .admin-box { margin-top: 15px; border-top: 1px dashed var(--border-color); padding-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Tattoo Studio</h1>
            <p>Премиум сеансы & индивидуальные эскизы</p>
        </div>

        <!-- Переключение вкладок -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('booking', this)">Запись</button>
            <button class="tab-btn" onclick="switchTab('works', this)">Работы</button>
            <button class="tab-btn" onclick="switchTab('reviews', this)">Отзывы</button>
        </div>

        <!-- ВКЛАДКА 1: ЗАПИСЬ -->
        <div id="booking" class="tab-content active">
            <div class="card">
                <form id="bookingForm" action="/submit" method="POST" enctype="multipart/form-data">
                    <div class="form-group">
                        <label>Ваше имя</label>
                        <input type="text" name="client_name" placeholder="Как к вам обращаться?" required>
                    </div>
                    <div class="form-group">
                        <label>Желаемая дата</label>
                        <input type="date" name="session_date" required>
                    </div>
                    <div class="form-group">
                        <label>Время сеанса</label>
                        <input type="time" name="session_time" required>
                    </div>
                    <div class="form-group">
                        <label>Размер и место татуировки</label>
                        <input type="text" name="tattoo_size" placeholder="Например: 15х10 см, предплечье" required>
                    </div>
                    <div class="form-group">
                        <label>Эскиз или референс</label>
                        <label class="file-upload-btn">
                            📁 Выбрать фото эскиза
                            <input type="file" name="tattoo_photo" accept="image/*" required onchange="document.getElementById('fileName').textContent = this.files[0] ? this.files[0].name : 'Файл не выбран'">
                        </label>
                        <div class="file-name" id="fileName">Файл не выбран</div>
                    </div>
                    <!-- Сюда автоматически подставится Телеграм юзернейм -->
                    <input type="hidden" name="telegram_id" id="telegram_id">
                    <button type="submit" class="submit-btn">Отправить заявку</button>
                </form>
            </div>
        </div>

        <!-- ВКЛАДКА 2: РАБОТЫ -->
        <div id="works" class="tab-content">
            <div class="card">
                <h3 style="font-size: 15px; margin-bottom: 12px; text-transform: uppercase;">Портфолио мастера</h3>
                <div class="grid-gallery" id="worksContainer">
                    <div class="gallery-item"><img src="https://images.unsplash.com/photo-1598371835066-1752aced453f?q=80&w=400" alt="Work"></div>
                    <div class="gallery-item"><img src="https://images.unsplash.com/photo-1611501275019-9b5cda994e8d?q=80&w=400" alt="Work"></div>
                </div>

                <!-- Панель загрузки для мастера -->
                <div class="admin-box">
                    <label>Добавить фото в портфолио (для мастера)</label>
                    <input type="file" id="newWorkInput" accept="image/*" style="margin-bottom: 8px;">
                    <button type="button" class="submit-btn" style="padding: 10px; font-size: 13px;" onclick="addWork()">Загрузить работу</button>
                </div>
            </div>
        </div>

        <!-- ВКЛАДКА 3: ОТЗЫВЫ -->
        <div id="reviews" class="tab-content">
            <div class="card">
                <h3 style="font-size: 15px; margin-bottom: 12px; text-transform: uppercase;">Отзывы клиентов</h3>
                <div id="reviewsContainer">
                    <div class="review-card">
                        <div class="review-author">Алексей</div>
                        <div class="review-text">Шикарная студия! Мастер профессионал своего дела, атмосфера топ.</div>
                    </div>
                </div>

                <!-- Панель добавления отзыва для мастера -->
                <div class="admin-box">
                    <label>Добавить отзыв</label>
                    <input type="text" id="reviewAuthor" placeholder="Имя клиента" style="margin-bottom: 8px;">
                    <textarea id="reviewText" placeholder="Текст отзыва..." rows="2" style="margin-bottom: 8px;"></textarea>
                    <button type="button" class="submit-btn" style="padding: 10px; font-size: 13px;" onclick="addReview()">Опубликовать отзыв</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Автоматически получаем Telegram Username через @
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            const identifier = user.username ? `@${user.username}` : `${user.first_name} (ID: ${user.id})`;
            document.getElementById('telegram_id').value = identifier;
        } else {
            document.getElementById('telegram_id').value = "@youngyannniii"; // Заглушка на случай теста в браузере
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function addWork() {
            const input = document.getElementById('newWorkInput');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const container = document.getElementById('worksContainer');
                    const div = document.createElement('div');
                    div.className = 'gallery-item';
                    div.innerHTML = `<img src="${e.target.result}" alt="Work">`;
                    container.prepend(div);
                    input.value = '';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function addReview() {
            const author = document.getElementById('reviewAuthor').value;
            const text = document.getElementById('reviewText').value;
            if (author && text) {
                const container = document.getElementById('reviewsContainer');
                const div = document.createElement('div');
                div.className = 'review-card';
                div.innerHTML = `<div class="review-author">${author}</div><div class="review-text">${text}</div>`;
                container.prepend(div);
                document.getElementById('reviewAuthor').value = '';
                document.getElementById('reviewText').value = '';
            }
        }
    </script>
</body>
</html>
