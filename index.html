<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIIZZYTATTT • Запись на сеанс</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --glass-bg: rgba(22, 22, 26, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #ff334b;
            --accent-glow: rgba(255, 51, 75, 0.3);
            --text-main: #ffffff;
            --text-secondary: #8e8e99;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 15px;
        }

        /* Таббар с вкладками */
        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 5px;
            margin-bottom: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            border-radius: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .section {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Карточки формы */
        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            backdrop-filter: blur(25px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        label.field-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 14px 16px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input::placeholder, textarea::placeholder {
            color: #6c6c75;
        }

        input:focus, textarea:focus {
            border-color: var(--accent);
        }

        /* Сетка слотов времени */
        .slots-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .slot-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .slot-item:hover {
            border-color: var(--accent);
            background: rgba(255, 51, 75, 0.05);
        }

        .slot-item.selected {
            border-color: var(--accent);
            background: rgba(255, 51, 75, 0.15);
            box-shadow: 0 0 15px rgba(255, 51, 75, 0.2);
        }

        .slot-item.booked {
            opacity: 0.3;
            cursor: not-allowed;
            background: rgba(0,0,0,0.2);
        }

        .slot-date {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .slot-time {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }

        /* Кнопка выбора файла */
        .file-upload-wrapper {
            position: relative;
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed var(--glass-border);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 16px;
            transition: 0.2s;
        }

        .file-upload-wrapper:hover {
            border-color: var(--accent);
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            margin: 0;
        }

        .file-upload-text {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .file-name-info {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Главная кнопка бронирования */
        button.btn {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 24px var(--accent-glow);
            transition: transform 0.2s, opacity 0.2s;
        }

        button.btn:active {
            transform: scale(0.97);
        }

        /* Портфолио сетка */
        .works-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .work-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 1;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
        }

        .work-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: var(--accent);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Отзывы */
        .review-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .review-card strong {
            color: #fff;
            font-size: 15px;
        }

        .review-card p {
            color: var(--text-secondary);
            font-size: 13.5px;
            margin-top: 6px;
            line-height: 1.4;
        }

        .quick-time {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .time-chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
        }
        .time-chip:hover {
            background: var(--accent);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="studioTitle">LIIZZYTATTT</h1>
    </div>

    <!-- Таббар -->
    <div class="tabs" id="tabsContainer">
        <div class="tab active" onclick="switchTab('booking')">Запись</div>
        <div class="tab" onclick="switchTab('works')">Работы</div>
        <div class="tab" onclick="switchTab('reviews')">Отзывы</div>
    </div>

    <!-- ВКЛАДКА 1: ЗАПИСЬ (Точно как на вашем скриншоте) -->
    <div id="booking-section" class="section active">
        <div class="card">
            <label class="field-label">Ваше имя</label>
            <input type="text" id="clientName" placeholder="Как к вам обращаться?">

            <label class="field-label">Ваш Telegram</label>
            <input type="text" id="clientTg" placeholder="Ваш @username">

            <label class="field-label">Выберите свободное время сеанса</label>
            <div id="slotsContainer" class="slots-grid">
                <p style="color: var(--text-secondary); grid-column: span 2; text-align: center; padding: 10px;">Загрузка слотов...</p>
            </div>

            <label class="field-label">Размер и место татуировки</label>
            <input type="text" id="tattooSize" placeholder="Например: 15x10 см, предплечье">

            <label class="field-label">Эскиз или референс</label>
            <div class="file-upload-wrapper">
                <div class="file-upload-text">📁 ВЫБРАТЬ ФОТО ЭСКИЗА</div>
                <div class="file-name-info" id="fileNameInfo">Файл не выбран</div>
                <input type="file" id="tattooPhoto" accept="image/*" onchange="updateFileName(this)">
            </div>

            <button class="btn" onclick="submitBooking()">ЗАБРОНИРОВАТЬ СЕАНС</button>
        </div>
    </div>

    <!-- ВКЛАДКА 2: РАБОТЫ -->
    <div id="works-section" class="section">
        <div class="card">
            <h3 style="font-size: 16px; margin-bottom: 14px;">Портфолио</h3>
            <div id="worksContainer" class="works-grid">
                <p style="color: var(--text-secondary); grid-column: span 2; text-align: center; padding: 20px;">Загрузка работ...</p>
            </div>
        </div>
    </div>

    <!-- ВКЛАДКА 3: ОТЗЫВЫ -->
    <div id="reviews-section" class="section">
        <div class="card">
            <h3 style="font-size: 16px; margin-bottom: 14px;">Отзывы клиентов</h3>
            <div id="reviewsContainer">
                <p style="color: var(--text-secondary); text-align: center; padding: 20px;">Загрузка отзывов...</p>
            </div>
        </div>

        <div class="card">
            <label class="field-label">Ваше имя</label>
            <input type="text" id="reviewAuthor" placeholder="Как вас зовут?">
            <label class="field-label">Текст отзыва</label>
            <textarea id="reviewText" placeholder="Ваш отзыв о сеансе..." rows="3"></textarea>
            <label class="field-label">Фото (необязательно)</label>
            <input type="file" id="reviewPhoto" accept="image/*">
            <button class="btn" onclick="addReview()">Отправить отзыв</button>
        </div>
    </div>
</div>

<script>
    let appData = { slots: [], works: [], reviews: [], settings: {}, master_ids: [] };
    let selectedSlotId = null;

    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.expand();
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        
        if (tabName === 'booking') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('booking-section').classList.add('active');
        } else if (tabName === 'works') {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('works-section').classList.add('active');
        } else if (tabName === 'reviews') {
            document.querySelectorAll('.tab')[2].classList.add('active');
            document.getElementById('reviews-section').classList.add('active');
        } else if (tabName === 'master') {
            const masterTab = document.getElementById('masterTab');
            if (masterTab) masterTab.classList.add('active');
            const masterSec = document.getElementById('master-section');
            if (masterSec) masterSec.classList.add('active');
        }
    }

    function updateFileName(input) {
        const info = document.getElementById('fileNameInfo');
        if (input.files && input.files.length > 0) {
            info.innerText = input.files[0].name;
            info.style.color = '#fff';
        } else {
            info.innerText = 'Файл не выбран';
            info.style.color = 'var(--text-secondary)';
        }
    }

    function setTime(t) {
        document.getElementById('newSlotTime').value = t;
    }

    async function loadData() {
        try {
            const res = await fetch('/api/data');
            appData = await res.json();
            checkAndRenderMasterPanel();
            renderUI();
        } catch (e) {
            console.error('Ошибка загрузки данных:', e);
        }
    }

    function checkAndRenderMasterPanel() {
        const userId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
        const isMaster = appData.master_ids && appData.master_ids.includes(userId);

        const tabsContainer = document.getElementById('tabsContainer');
        let masterTab = document.getElementById('masterTab');
        let masterSection = document.getElementById('master-section');

        if (isMaster) {
            if (!masterTab) {
                tabsContainer.innerHTML += `<div class="tab" id="masterTab" onclick="switchTab('master')">Мастер</div>`;
            }
            if (!masterSection) {
                const container = document.querySelector('.container');
                const sectionDiv = document.createElement('div');
                sectionDiv.id = 'master-section';
                sectionDiv.className = 'section';
                sectionDiv.innerHTML = `
                    <div class="card">
                        <label class="field-label">Добавить свободный сеанс</label>
                        <input type="date" id="newSlotDate">
                        <div class="quick-time">
                            <div class="time-chip" onclick="setTime('11:00')">11:00</div>
                            <div class="time-chip" onclick="setTime('14:00')">14:00</div>
                            <div class="time-chip" onclick="setTime('17:00')">17:00</div>
                            <div class="time-chip" onclick="setTime('20:00')">20:00</div>
                        </div>
                        <input type="time" id="newSlotTime" value="12:30">
                        <button class="btn" onclick="addSlot()">Добавить слот</button>
                    </div>
                    <div class="card">
                        <label class="field-label">Загрузка работ (можно несколько сразу)</label>
                        <input type="file" id="workFiles" accept="image/*" multiple>
                        <button class="btn" onclick="addWorks()" style="margin-top: 10px;">Загрузить работу</button>
                    </div>
                    <div class="card">
                        <label class="field-label">Управление слотами и записями</label>
                        <div id="manageSlotsContainer" style="font-size: 13px; color: var(--text-secondary);">
                            Загрузка...
                        </div>
                    </div>
                `;
                container.appendChild(sectionDiv);
            }
        }
    }

    function renderUI() {
        if (appData.settings && appData.settings.studio_name) {
            document.getElementById('studioTitle').innerText = appData.settings.studio_name.toUpperCase();
        }

        // Рендер слотов
        const slotsContainer = document.getElementById('slotsContainer');
        const availableSlots = appData.slots.filter(s => !s.is_booked);
        if (!availableSlots || availableSlots.length === 0) {
            slotsContainer.innerHTML = '<p style="color: var(--text-secondary); grid-column: span 2; text-align: center; padding: 10px;">Нет свободных окошек</p>';
        } else {
            slotsContainer.innerHTML = availableSlots.map(s => `
                <div class="slot-item ${selectedSlotId === s.id ? 'selected' : ''}" onclick="selectSlot(${s.id})">
                    <div class="slot-date">${s.date}</div>
                    <div class="slot-time">${s.time}</div>
                </div>
            `).join('');
        }

        // Рендер работ (портфолио)
        const worksContainer = document.getElementById('worksContainer');
        const isMaster = appData.master_ids && appData.master_ids.includes(window.Telegram?.WebApp?.initDataUnsafe?.user?.id);
        
        if (!appData.works || appData.works.length === 0) {
            worksContainer.innerHTML = '<p style="color: var(--text-secondary); grid-column: span 2; text-align: center; padding: 20px;">Портфолио пока пусто</p>';
        } else {
            worksContainer.innerHTML = appData.works.map(w => `
                <div class="work-card">
                    <img src="${w.image_url || w.url}" alt="Work" loading="lazy">
                    ${isMaster ? `<button class="delete-btn" onclick="deleteWork(${w.id})">×</button>` : ''}
                </div>
            `).join('');
        }

        // Отзывы
        const reviewsContainer = document.getElementById('reviewsContainer');
        if (!appData.reviews || appData.reviews.length === 0) {
            reviewsContainer.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 20px;">Пока нет отзывов</p>';
        } else {
            reviewsContainer.innerHTML = appData.reviews.map(r => `
                <div class="review-card">
                    <strong>${r.author}</strong>
                    <p>${r.text}</p>
                    ${r.photo_url || r.url ? `<img src="${r.photo_url || r.url}" style="margin-top:10px; border-radius:12px; width:100%; max-height:160px; object-fit:cover;">` : ''}
                </div>
            `).join('');
        }

        // Панель управления мастера
        const manageContainer = document.getElementById('manageSlotsContainer');
        if (manageContainer) {
            const bookedSlots = appData.slots.filter(s => s.is_booked);
            manageContainer.innerHTML = `
                <p style="margin-bottom: 8px; color: #fff;"><b>Занятые записи клиентов:</b></p>
                ${bookedSlots.length === 0 ? '<p style="margin-bottom: 14px; color: var(--text-secondary);">Нет активных записей</p>' : 
                    bookedSlots.map(s => `<div style="background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--glass-border);">
                        📅 <b>${s.date}</b> в ${s.time}<br>
                        👤 ${s.client_name} (@${s.client_tg.replace('@','')})<br>
                        📐 ${s.tattoo_size}
                    </div>`).join('')}
                <p style="margin-top: 14px; margin-bottom: 8px; color: #fff;"><b>Все слоты в базе:</b></p>
                <div>
                    ${appData.slots.map(s => `<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; background: rgba(255,255,255,0.03); padding: 8px 12px; border-radius: 10px; border: 1px solid var(--glass-border);"><span>${s.date} ${s.time} (${s.is_booked ? 'Занято' : 'Свободно'})</span> <button style="background:var(--accent); color:#fff; border:none; padding:6px 12px; border-radius:8px; cursor:pointer;" onclick="deleteSlot(${s.id})">Удалить</button></div>`).join('')}
                </div>
            `;
        }
    }

    function selectSlot(id) {
        selectedSlotId = id;
        renderUI();
    }

    async function addSlot() {
        const date = document.getElementById('newSlotDate').value;
        const time = document.getElementById('newSlotTime').value;
        if (!date || !time) return;
        
        const res = await fetch('/api/slots', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date, time })
        });
        if (res.ok) {
            document.getElementById('newSlotDate').value = '';
            loadData();
        }
    }

    async function deleteSlot(id) {
        if (!confirm('Удалить слот?')) return;
        const res = await fetch(`/api/slots/${id}`, { method: 'DELETE' });
        if (res.ok) loadData();
    }

    // Множественная загрузка работ для мастера
    async function addWorks() {
        const fileInput = document.getElementById('workFiles');
        if (fileInput.files.length === 0) {
            alert('Выберите файлы работ!');
            return;
        }
        const formData = new FormData();
        for (let i = 0; i < fileInput.files.length; i++) {
            formData.append('files', fileInput.files[i]);
        }

        const res = await fetch('/api/works', { method: 'POST', body: formData });
        if (res.ok) {
            fileInput.value = '';
            loadData();
            alert('Работы успешно добавлены!');
        } else {
            alert('Ошибка загрузки');
        }
    }

    async function deleteWork(id) {
        if (!confirm('Удалить работу?')) return;
        const res = await fetch(`/api/works/${id}`, { method: 'DELETE' });
        if (res.ok) loadData();
    }

    async function addReview() {
        const author = document.getElementById('reviewAuthor').value;
        const text = document.getElementById('reviewText').value;
        const photo = document.getElementById('reviewPhoto').files[0];

        if (!author || !text) {
            alert('Заполните имя и текст отзыва!');
            return;
        }

        const formData = new FormData();
        formData.append('author', author);
        formData.append('text', text);
        if (photo) formData.append('photo', photo);

        const res = await fetch('/api/reviews', { method: 'POST', body: formData });
        if (res.ok) {
            document.getElementById('reviewAuthor').value = '';
            document.getElementById('reviewText').value = '';
            document.getElementById('reviewPhoto').value = '';
            loadData();
            switchTab('reviews');
        }
    }

    async function submitBooking() {
        const clientName = document.getElementById('clientName').value;
        const clientTg = document.getElementById('clientTg').value;
        const tattooSize = document.getElementById('tattooSize').value;
        const photoFile = document.getElementById('tattooPhoto').files[0];

        if (!clientName || !clientTg || !tattooSize || !selectedSlotId) {
            alert('Пожалуйста, заполните все поля и выберите время сеанса!');
            return;
        }

        const formData = new FormData();
        formData.append('slot_id', selectedSlotId);
        formData.append('client_name', clientName);
        formData.append('client_tg', clientTg);
        formData.append('tattoo_size', tattooSize);
        if (photoFile) formData.append('tattoo_photo', photoFile);

        const res = await fetch('/api/book', { method: 'POST', body: formData });
        if (res.ok) {
            alert('Запись успешно оформлена! Мастер получил уведомление.');
            document.getElementById('clientName').value = '';
            document.getElementById('clientTg').value = '';
            document.getElementById('tattooSize').value = '';
            document.getElementById('tattooPhoto').value = '';
            document.getElementById('fileNameInfo').innerText = 'Файл не выбран';
            selectedSlotId = null;
            loadData();
        } else {
            alert('Ошибка при бронировании');
        }
    }

    loadData();
</script>

</body>
</html>
