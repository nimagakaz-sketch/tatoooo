<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запись на сеанс | Tattoo Studio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0d0d0d);
            --text-color: var(--tg-theme-text-color, #f5f5f7);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --accent-red: #c51d24;
            --card-bg: rgba(25, 25, 25, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 16px; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; background-image: radial-gradient(circle at 50% 0%, rgba(197, 29, 36, 0.15) 0%, transparent 60%); }
        .container { max-width: 480px; width: 100%; margin: 0 auto; padding-bottom: 20px; }
        .header { text-align: center; margin-bottom: 24px; padding-top: 10px; }
        .header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; color: #ffffff; text-transform: uppercase; text-shadow: 0 2px 10px rgba(197, 29, 36, 0.3); }
        .header p { font-size: 14px; color: var(--hint-color); }
        .card { background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: var(--hint-color); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="text"], input[type="date"], input[type="time"] { width: 100%; padding: 12px 16px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-color); font-size: 16px; outline: none; transition: all 0.3s ease; }
        input:focus { border-color: var(--accent-red); box-shadow: 0 0 0 3px rgba(197, 29, 36, 0.25); }
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
        .file-upload-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.05); border: 1px dashed rgba(255, 255, 255, 0.2); border-radius: 12px; color: var(--text-color); font-size: 15px; font-weight: 500; cursor: pointer; }
        input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .file-name { margin-top: 6px; font-size: 13px; color: var(--hint-color); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .submit-btn { width: 100%; margin-top: 24px; padding: 16px; background: linear-gradient(135deg, #e52d27 0%, #b31217 100%); color: #ffffff; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 20px rgba(197, 29, 36, 0.4); text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Запись на сеанс</h1>
            <p>Выберите удобное время и отправьте эскиз</p>
        </div>
        <div class="card">
            <form id="bookingForm" action="/submit" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Ваше имя</label>
                    <input type="text" name="client_name" placeholder="Как к вам обращаться?" required>
                </div>
                <div class="form-group">
                    <label>Желаемая дата</label>
                    <input type="date" name="session_date" required>
                </div>
                <div class="form-group">
                    <label>Время сеанса</label>
                    <input type="time" name="session_time" required>
                </div>
                <div class="form-group">
                    <label>Размер и место татуировки</label>
                    <input type="text" name="tattoo_size" placeholder="Например: 15х10 см, предплечье" required>
                </div>
                <div class="form-group">
                    <label>Эскиз или референс</label>
                    <div class="file-upload-wrapper">
                        <div class="file-upload-btn">📁 Выбрать фото эскиза</div>
                        <input type="file" name="tattoo_photo" id="fileInput" accept="image/*" required onchange="document.getElementById('fileName').textContent = this.files[0] ? this.files[0].name : 'Файл не выбран'">
                    </div>
                    <div class="file-name" id="fileName">Файл не выбран</div>
                </div>
                <input type="hidden" name="telegram_id" id="telegram_id">
                <button type="submit" class="submit-btn">Отправить заявку</button>
            </form>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('telegram_id').value = tg.initDataUnsafe.user.id;
        }
    </script>
</body>
</html>
