<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tattoo Studio | Liquid Glass</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #08080a;
            --text-color: #f5f5f7;
            --hint-color: #8e8e93;
            --accent-red: #ff2a36;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 42, 54, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(80, 20, 30, 0.2) 0%, transparent 50%),
                url('https://images.unsplash.com/photo-1544457070-4cd773b4d71e?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            padding: 16px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container { max-width: 480px; width: 100%; margin: 0 auto; padding-bottom: 50px; }

        .header { text-align: center; margin-bottom: 24px; padding-top: 10px; }
        .header h1 { font-size: 24px; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 20px rgba(255, 42, 54, 0.5); }
        .header p { font-size: 13px; color: var(--hint-color); margin-top: 4px; }

        /* Liquid Glass Tabs */
        .tabs {
            display: flex;
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 16px;
            padding: 6px;
            margin-bottom: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .tab-btn {
            flex: 1;
            padding: 11px;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--hint-color);
            font-size: 12px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(255, 42, 54, 0.9), rgba(180, 15, 25, 0.9));
            color: #fff;
            box-shadow: 0 8px 25px rgba(255, 42, 54, 0.4);
            transform: scale(1.02);
        }

        /* Smooth Tab Animation Container */
        .tab-content {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .tab-content.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 22px;
            box-shadow: var(--glass-shadow);
            margin-bottom: 16px;
        }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 11px; font-weight: 700; color: var(--hint-color); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

        input, textarea, select {
            width: 100%; padding: 14px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 14px; color: var(--text-color);
            font-size: 15px; outline: none; transition: all 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 0 4px rgba(255, 42, 54, 0.2);
        }

        /* Слоты для записи */
        .slots-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 4px;
        }

        .slot-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }
        .slot-item.booked {
            background: rgba(255, 255, 255, 0.01);
            color: #555;
            border-color: rgba(255, 255, 255, 0.02);
            cursor: not-allowed;
            text-decoration: line-through;
        }
        .slot-item.selected {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 42, 54, 0.4);
            font-weight: bold;
        }

        .file-upload-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 14px; color: var(--text-color); font-size: 14px; cursor: pointer;
            transition: all 0.3s;
        }
        .file-upload-btn:hover { background: rgba(255, 255, 255, 0.07); border-color: var(--accent-red); }
        input[type="file"] { display: none; }
        .file-name { font-size: 12px; color: var(--hint-color); margin-top: 6px; text-align: center; }

        .submit-btn {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #ff2a36 0%, #b31217 100%);
            color: #fff; border: none; border-radius: 14px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            box-shadow: 0 6px 25px rgba(255, 42, 54, 0.4); text-transform: uppercase;
            letter-spacing: 0.5px; transition: transform 0.2s;
        }
        .submit-btn:active { transform: scale(0.98); }

        /* Галерея и отзывы */
        .grid-gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .gallery-item { border-radius: 14px; overflow: hidden; height: 160px; background: #15151a; border: 1px solid var(--glass-border); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        
        .review-card { background: rgba(0,0,0,0.3); padding: 14px; border-radius: 14px; margin-bottom: 10px; border: 1px solid var(--glass-border); }
        .review-author { font-weight: 700; font-size: 13px; color: var(--accent-red); margin-bottom: 4px; }
        .review-text { font-size: 13px; color: #ddd; }

        .admin-section { margin-top: 20px; border-top: 1px dashed var(--glass-border); padding-top: 15px; }
        .admin-title { font-size: 11px; font-weight: 700; color: var(--accent-red); margin-bottom: 10px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Tattoo Studio</h1>
            <p>Liquid Glass Experience</p>
        </div>

        <!-- Плавные вкладки -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('booking', this)">Запись</button>
            <button class="tab-btn" onclick="switchTab('works', this)">Работы</button>
            <button class="tab-btn" onclick="switchTab('reviews', this)">Отзывы</button>
        </div>

        <!-- ВКЛАДКА 1: ЗАПИСЬ -->
        <div id="booking" class="tab-content active">
            <div class="glass-card">
                <form id="bookingForm" action="/submit" method="POST">
                    <div class="form-group">
                        <label>Ваше имя</label>
                        <input type="text" name="client_name" placeholder="Как к вам обращаться?" required>
                    </div>

                    <div class="form-group">
                        <label>Выберите свободное время сеанса</label>
                        <div class="slots-grid" id="slotsContainer">
                            <!-- Подгружается из БД -->
                        </div>
                        <input type="hidden" name="slot_id" id="selectedSlotId" required>
                    </div>

                    <div class="form-group">
                        <label>Размер и место татуировки</label>
                        <input type="text" name="tattoo_size" placeholder="Например: 15х10 см, предплечье" required>
                    </div>

                    <div class="form-group">
                        <label>Эскиз или референс</label>
                        <label class="file-upload-btn">
                            📁 Выбрать фото эскиза
                            <input type="file" name="tattoo_photo" accept="image/*" required onchange="document.getElementById('fileName').textContent = this.files[0] ? this.files[0].name : 'Файл не выбран'">
                        </label>
                        <div class="file-name" id="fileName">Файл не выбран</div>
                    </div>

                    <input type="hidden" name="telegram_id" id="telegram_id">
                    <button type="submit" class="submit-btn">Забронировать сеанс</button>
                </form>
            </div>
        </div>

        <!-- ВКЛАДКА 2: РАБОТЫ -->
        <div id="works" class="tab-content">
            <div class="glass-card">
                <h3 style="font-size: 14px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;">Портфолио</h3>
                <div class="grid-gallery" id="worksContainer">
                    <!-- Загружается из БД -->
                </div>

                <!-- Админ-панель мастера: Добавить работу -->
                <div class="admin-section">
                    <div class="admin-title">Панель мастера: загрузка работы</div>
                    <input type="file" id="adminWorkFile" accept="image/*" style="margin-bottom: 8px; font-size: 12px;">
                    <button type="button" class="submit-btn" style="padding: 10px; font-size: 12px;" onclick="uploadWork()">Загрузить в портфолио</button>
                </div>
            </div>
        </div>

        <!-- ВКЛАДКА 3: ОТЗЫВЫ -->
        <div id="reviews" class="tab-content">
            <div class="glass-card">
                <h3 style="font-size: 14px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;">Отзывы клиентов</h3>
                <div id="reviewsContainer">
                    <!-- Загружается из БД -->
                </div>

                <!-- Админ-панель мастера: Добавить слот и отзыв -->
                <div class="admin-section">
                    <div class="admin-title">Панель мастера: добавить слот расписания</div>
                    <input type="date" id="newSlotDate" style="margin-bottom: 8px;">
                    <input type="time" id="newSlotTime" style="margin-bottom: 8px;">
                    <button type="button" class="submit-btn" style="padding: 10px; font-size: 12px; margin-bottom: 15px;" onclick="addSlot()">Создать слот</button>

                    <div class="admin-title">Панель мастера: добавить отзыв</div>
                    <input type="text" id="reviewAuthor" placeholder="Имя клиента" style="margin-bottom: 8px;">
                    <textarea id="reviewText" placeholder="Текст отзыва..." rows="2" style="margin-bottom: 8px;"></textarea>
                    <button type="button" class="submit-btn" style="padding: 10px; font-size: 12px;" onclick="addReview()">Опубликовать отзыв</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('telegram_id').value = user.username ? `@${user.username}` : `${user.first_name} (ID: ${user.id})`;
        } else {
            document.getElementById('telegram_id').value = "@youngyannniii";
        }

        // Плавное переключение вкладок
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // Загрузка данных из БД при старте
        async function loadData() {
            const res = await fetch('/api/data');
            const data = await res.json();

            // Отрисовка слотов
            const slotsContainer = document.getElementById('slotsContainer');
            slotsContainer.innerHTML = '';
            data.slots.forEach(slot => {
                const div = document.createElement('div');
                div.className = `slot-item ${slot.is_booked ? 'booked' : ''}`;
                div.innerHTML = `${slot.date}<br><b>${slot.time}</b>`;
                if (!slot.is_booked) {
                    div.onclick = () => {
                        document.querySelectorAll('.slot-item').forEach(s => s.classList.remove('selected'));
                        div.classList.add('selected');
                        document.getElementById('selectedSlotId').value = slot.id;
                    };
                } else {
                    div.title = "Занято";
                }
                slotsContainer.appendChild(div);
            });

            // Отрисовка работ
            const worksContainer = document.getElementById('worksContainer');
            worksContainer.innerHTML = '';
            data.works.forEach(work => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `<img src="${work.url}" alt="Work">`;
                worksContainer.appendChild(div);
            });

            // Отрисовка отзывов
            const reviewsContainer = document.getElementById('reviewsContainer');
            reviewsContainer.innerHTML = '';
            data.reviews.forEach(rev => {
                const div = document.createElement('div');
                div.className = 'review-card';
                div.innerHTML = `<div class="review-author">${rev.author}</div><div class="review-text">${rev.text}</div>`;
                reviewsContainer.appendChild(div);
            });
        }

        // Функции администратора для мастера
        async function addSlot() {
            const date = document.getElementById('newSlotDate').value;
            const time = document.getElementById('newSlotTime').value;
            if(!date || !time) return alert("Выберите дату и время!");
            
            const formData = new FormData();
            formData.append('date', date);
            formData.append('time', time);

            await fetch('/api/admin/add_slot', { method: 'POST', body: formData });
            loadData();
            alert("Слот успешно добавлен!");
        }

        async function uploadWork() {
            const fileInput = document.getElementById('adminWorkFile');
            if(!fileInput.files[0]) return alert("Выберите файл!");

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            await fetch('/api/admin/add_work', { method: 'POST', body: formData });
            fileInput.value = '';
            loadData();
            alert("Работа загружена в портфолио!");
        }

        async function addReview() {
            const author = document.getElementById('reviewAuthor').value;
            const text = document.getElementById('reviewText').value;
            if(!author || !text) return alert("Заполните поля отзыва!");

            const formData = new FormData();
            formData.append('author', author);
            formData.append('text', text);

            await fetch('/api/admin/add_review', { method: 'POST', body: formData });
            document.getElementById('reviewAuthor').value = '';
            document.getElementById('reviewText').value = '';
            loadData();
            alert("Отзыв опубликован!");
        }

        loadData();
    </script>
</body>
</html>
