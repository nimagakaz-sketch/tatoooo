<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIIZZYTATTT • Запись на сеанс</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f11;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent: #ff334b;
            --text-main: #ffffff;
            --text-secondary: #a0a0ab;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 1px;
            color: #fff;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            backdrop-filter: blur(16px);
        }

        .card h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        input, select, textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 10px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        button.btn {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 51, 75, 0.3);
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .slot-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
        }

        .slot-item.booked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .works-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .work-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 1;
            background: rgba(0,0,0,0.5);
        }

        .work-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .delete-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.7);
            color: #ff334b;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .quick-time {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .time-chip {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="studioTitle">LIIZZYTATTT</h1>

    <!-- Блок: Свободные окошки для записи -->
    <div class="card">
        <h3>📅 Свободные окошки</h3>
        <div id="slotsContainer" class="slots-grid">
            <p style="color: var(--text-secondary); grid-column: span 2;">Загрузка слотов...</p>
        </div>
    </div>

    <!-- Форма бронирования (появляется при клике на слот) -->
    <div class="card" id="bookingFormCard" style="display: none;">
        <h3>✍️ Записаться на сеанс</h3>
        <p id="selectedSlotInfo" style="margin-bottom: 10px; font-size: 14px; color: var(--accent);"></p>
        <input type="text" id="clientName" placeholder="Ваше имя">
        <input type="text" id="clientTg" placeholder="Ваш Telegram (@username)">
        <input type="text" id="tattooSize" placeholder="Размер и место">
        <input type="file" id="tattooPhoto" accept="image/*">
        <button class="btn" onclick="submitBooking()">Подтвердить запись</button>
    </div>

    <!-- Блок: Портфолио -->
    <div class="card">
        <h3>🖤 Портфолио</h3>
        <div id="worksContainer" class="works-grid">
            <p style="color: var(--text-secondary); grid-column: span 2;">Загрузка работ...</p>
        </div>
    </div>

    <!-- Блок: Панель мастера (добавление слотов и работ) -->
    <div class="card">
        <h3>➕ Добавить свободный сеанс</h3>
        <input type="date" id="newSlotDate">
        <div class="quick-time">
            <div class="time-chip" onclick="setTime('11:00')">11:00</div>
            <div class="time-chip" onclick="setTime('14:00')">14:00</div>
            <div class="time-chip" onclick="setTime('17:00')">17:00</div>
            <div class="time-chip" onclick="setTime('20:00')">20:00</div>
        </div>
        <input type="time" id="newSlotTime" value="12:30">
        <button class="btn" onclick="addSlot()">Добавить слот</button>
    </div>

    <div class="card">
        <h3>🖼 Загрузить работу в портфолио</h3>
        <input type="file" id="workFile" accept="image/*">
        <button class="btn" onclick="addWork()">Загрузить работу</button>
    </div>

    <div class="card">
        <h3>📌 Активные заявки и управление</h3>
        <div id="manageContainer" style="font-size: 13px; color: var(--text-secondary);">
            Загрузка данных...
        </div>
    </div>
</div>

<script>
    let appData = { slots: [], works: [], reviews: [], settings: {} };
    let selectedSlotId = null;

    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.expand();
    }

    function setTime(t) {
        document.getElementById('newSlotTime').value = t;
    }

    async function loadData() {
        try {
            const res = await fetch('/api/data');
            appData = await res.json();
            renderUI();
        } catch (e) {
            console.error('Ошибка загрузки данных:', e);
        }
    }

    function renderUI() {
        if (appData.settings && appData.settings.studio_name) {
            document.getElementById('studioTitle').innerText = appData.settings.studio_name.toUpperCase();
        }

        const slotsContainer = document.getElementById('slotsContainer');
        if (!appData.slots || appData.slots.length === 0) {
            slotsContainer.innerHTML = '<p style="color: var(--text-secondary); grid-column: span 2;">Нет свободных окошек</p>';
        } else {
            slotsContainer.innerHTML = appData.slots.map(s => `
                <div class="slot-item ${s.is_booked ? 'booked' : ''}" ${!s.is_booked ? `onclick="selectSlot(${s.id}, '${s.date}', '${s.time}')"` : ''}>
                    <strong>${s.date}</strong><br>
                    <span>${s.time}</span><br>
                    <small style="color: ${s.is_booked ? 'var(--accent)' : '#4cd137'}">${s.is_booked ? 'Занято' : 'Свободно'}</small>
                </div>
            `).join('');
        }

        const worksContainer = document.getElementById('worksContainer');
        if (!appData.works || appData.works.length === 0) {
            worksContainer.innerHTML = '<p style="color: var(--text-secondary); grid-column: span 2;">Портфолио пока пусто</p>';
        } else {
            worksContainer.innerHTML = appData.works.map(w => `
                <div class="work-card">
                    <img src="${w.image_url || w.url}" alt="Work">
                    <button class="delete-btn" onclick="deleteWork(${w.id})">×</button>
                </div>
            `).join('');
        }

        const manageContainer = document.getElementById('manageContainer');
        const bookedSlots = appData.slots.filter(s => s.is_booked);
        
        manageContainer.innerHTML = `
            <p style="margin-bottom: 8px;"><b>Занятые записи клиентов:</b></p>
            ${bookedSlots.length === 0 ? '<p style="margin-bottom: 12px; color: var(--text-secondary);">Нет активных записей</p>' : 
                bookedSlots.map(s => `<div style="background: rgba(255,255,255,0.03); padding: 8px; border-radius: 8px; margin-bottom: 6px;">
                    📅 ${s.date} ${s.time}<br>
                    👤 ${s.client_name || 'Клиент'} (@${s.client_tg || 'нет'})<br>
                    📐 ${s.tattoo_size || 'Не указано'}
                </div>`).join('')}
            <p style="margin-top: 12px; margin-bottom: 8px;"><b>Все слоты:</b></p>
            <div>
                ${appData.slots.map(s => `<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; background: rgba(255,255,255,0.03); padding: 6px; border-radius: 8px;"><span>${s.date} ${s.time} (${s.is_booked ? 'Занято' : 'Свободно'})</span> <button style="background:var(--accent); color:#fff; border:none; padding:4px 8px; border-radius:6px; cursor:pointer;" onclick="deleteSlot(${s.id})">Удалить</button></div>`).join('')}
            </div>
        `;
    }

    function selectSlot(id, date, time) {
        selectedSlotId = id;
        document.getElementById('bookingFormCard').style.display = 'block';
        document.getElementById('selectedSlotInfo').innerText = `Выбрано время: ${date} в ${time}`;
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    async function addSlot() {
        const date = document.getElementById('newSlotDate').value;
        const time = document.getElementById('newSlotTime').value;
        if (!date || !time) return;
        
        const res = await fetch('/api/slots', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date, time })
        });
        if (res.ok) {
            document.getElementById('newSlotDate').value = '';
            loadData();
        }
    }

    async function deleteSlot(id) {
        if (!confirm('Удалить этот слот?')) return;
        const res = await fetch(`/api/slots/${id}`, { method: 'DELETE' });
        if (res.ok) loadData();
    }

    async function addWork() {
        const fileInput = document.getElementById('workFile');
        if (fileInput.files.length === 0) return;
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        const res = await fetch('/api/works', { method: 'POST', body: formData });
        if (res.ok) {
            fileInput.value = '';
            loadData();
        }
    }

    async function deleteWork(id) {
        if (!confirm('Удалить работу?')) return;
        const res = await fetch(`/api/works/${id}`, { method: 'DELETE' });
        if (res.ok) loadData();
    }

    async function submitBooking() {
        const clientName = document.getElementById('clientName').value;
        const clientTg = document.getElementById('clientTg').value;
        const tattooSize = document.getElementById('tattooSize').value;
        const photoFile = document.getElementById('tattooPhoto').files[0];

        if (!clientName || !clientTg || !tattooSize || !selectedSlotId) return;

        const formData = new FormData();
        formData.append('slot_id', selectedSlotId);
        formData.append('client_name', clientName);
        formData.append('client_tg', clientTg);
        formData.append('tattoo_size', tattooSize);
        if (photoFile) formData.append('tattoo_photo', photoFile);

        const res = await fetch('/api/book', { method: 'POST', body: formData });
        if (res.ok) {
            document.getElementById('bookingFormCard').style.display = 'none';
            document.getElementById('clientName').value = '';
            document.getElementById('clientTg').value = '';
            document.getElementById('tattooSize').value = '';
            document.getElementById('tattooPhoto').value = '';
            loadData();
        }
    }

    loadData();
</script>

</body>
</html>
