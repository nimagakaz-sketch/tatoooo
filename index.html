<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на сеанс татуировки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #121212; 
            color: #fff; 
            padding: 20px; 
            margin: 0;
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #f3f4f6;
        }
        .form-group { 
            margin-bottom: 16px; 
        }
        label { 
            display: block; 
            margin-bottom: 6px; 
            color: #9ca3af; 
            font-size: 14px;
        }
        input, select { 
            width: 100%; 
            padding: 12px; 
            background: #1e1e1e; 
            border: 1px solid #333; 
            color: #fff; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #e50914;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #e50914; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 16px;
            cursor: pointer; 
            margin-top: 20px; 
            transition: background 0.2s;
        }
        button:active {
            background: #b80710;
        }
    </style>
</head>
<body>
    <h2>Запись к тату-мастеру</h2>
    <form id="bookingForm" action="/submit" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>Ваше имя</label>
            <input type="text" name="client_name" placeholder="Как к вам обращаться?" required>
        </div>
        <div class="form-group">
            <label>Дата сеанса</label>
            <input type="date" name="session_date" required>
        </div>
        <div class="form-group">
            <label>Время</label>
            <input type="time" name="session_time" required>
        </div>
        <div class="form-group">
            <label>Размер и место татуировки</label>
            <input type="text" name="tattoo_size" placeholder="например, 15х10 см на предплечье" required>
        </div>
        <div class="form-group">
            <label>Эскиз / фото (если есть)</label>
            <input type="file" name="tattoo_photo" accept="image/*" required>
        </div>
        <input type="hidden" name="telegram_id" id="telegram_id">
        <button type="submit">Отправить заявку</button>
    </form>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('telegram_id').value = tg.initDataUnsafe.user.id;
        }
    </script>
</body>
</html>
