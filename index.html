<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIIZZYTATTT • Тату-студия</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #070709;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-hover: rgba(255, 51, 75, 0.4);
            --accent: #ff334b;
            --accent-glow: rgba(255, 51, 75, 0.25);
            --text-main: #f3f3f5;
            --text-secondary: #8e8e99;
            --success: #00d26a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(255, 51, 75, 0.07) 0%, transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(80, 40, 255, 0.05) 0%, transparent 45%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 10px;
        }

        h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 40%, #a0a0ab 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Премиальный таббар */
        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 6px;
            margin-bottom: 24px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
            font-weight: 700;
        }

        .section {
            display: none;
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Премиальные карточки */
        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 22px;
            margin-bottom: 16px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            transition: border-color 0.3s;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .card h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-main);
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Поля ввода */
        input, select, textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 14px 16px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 51, 75, 0.15);
        }

        input[type="file"] {
            padding: 10px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
        }

        button.btn {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 15px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 24px var(--accent-glow);
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }

        button.btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        /* Сетка слотов */
        .slots-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .slot-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .slot-item:hover {
            border-color: var(--glass-border-hover);
            background: rgba(255, 51, 75, 0.03);
            transform: translateY(-2px);
        }

        .slot-item.booked {
            opacity: 0.35;
            cursor: not-allowed;
            background: rgba(0, 0, 0, 0.2);
            border-color: transparent;
        }

        .slot-date {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .slot-time {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .slot-status {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Портфолио */
        .works-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .work-card {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            aspect-ratio: 1;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .work-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }

        .work-card:hover img {
            transform: scale(1.04);
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: var(--accent);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            transition: 0.2s;
        }

        .delete-btn:hover {
            background: var(--accent);
            color: #fff;
        }

        /* Отзывы */
        .review-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .review-card strong {
            color: #fff;
            font-size: 15px;
            letter-spacing: 0.2px;
        }

        .review-card p {
            color: var(--text-secondary);
            font-size: 13.5px;
            margin-top: 6px;
            line-height: 1.4;
        }

        .quick-time {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .time-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }

        .time-chip:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="studioTitle">LIIZZYTATTT</h1>
        <div class="subtitle">Art Tattoo Studio</div>
    </div>

    <!-- Таббар -->
    <div class="tabs" id="tabsContainer">
        <div class="tab active" onclick="switchTab('booking')">📅 Запись</div>
        <div class="tab" onclick="switchTab('works')">🖤 Работы</div>
        <div class="tab" onclick="switchTab('reviews')">💬 Отзывы</div>
    </div>

    <!-- ВКЛАДКА 1: ЗАПИСЬ -->
    <div id="booking-section" class="section active">
        <div class="card">
            <h3>Свободные окошки</h3>
            <div id="slotsContainer" class="slots-grid">
                <p style="color: var(--text-secondary); grid-column: span 2; text-align: center; padding: 20px;">Загрузка расписания...</p>
            </div>
        </div>

        <div class="card" id="bookingFormCard" style="display: none;">
            <h3>✍️ Забронировать сеанс</h3>
            <p id="selectedSlotInfo" style="margin-bottom: 16px; font-size: 14px; color: var(--accent); font-weight: 600;"></p>
            <input type="text" id="clientName" placeholder="Ваше имя">
            <input type="text" id="clientTg" placeholder="Ваш Telegram (@username)">
            <input type="text" id="tattooSize" placeholder="Размер и место (например, 15x10 на бедре)">
            <label style="font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 6px;">Эскиз или референс (необязательно):</label>
            <input type="file" id="tattooPhoto" accept="image/*">
            <button class="btn" onclick="submitBooking()">Подтвердить запись</button>
        </div>
    </div>

    <!-- ВКЛАДКА 2: РАБОТЫ -->
    <div id="works-section" class="section">
        <div class="card">
            <h3>Портфолио мастера</h3>
            <div id="worksContainer" class="works-grid">
                <p style="color: var(--text-secondary); grid-column: span 2; text-align: center; padding: 20px;">Загрузка портфолио...</p>
            </div>
        </div>
    </div>

    <!-- ВКЛАДКА 3: ОТЗЫВЫ -->
    <div id="reviews-section" class="section">
        <div class="card">
            <h3>Отзывы клиентов</h3>
            <div id="reviewsContainer">
                <p style="color: var(--text-secondary); text-align: center; padding: 20px;">Загрузка отзывов...</p>
            </div>
        </div>

        <div class="card">
            <h3>✍️ Оставить отзыв</h3>
            <input type="text" id="reviewAuthor" placeholder="Ваше имя">
            <textarea id="reviewText" placeholder="Ваш отзыв о сеансе..." rows="3"></textarea>
            <input type="file" id="reviewPhoto" accept="image/*">
            <button class="btn" onclick="addReview()">Отправить отзыв</button>
        </div>
    </div>
</div>

<script>
    let appData = { slots: [], works: [], reviews: [], settings: {}, master_ids: [] };
    let selectedSlotId = null;

    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.expand();
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        
        if (tabName === 'booking') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('booking-section').classList.add('active');
        } else if (tabName === 'works') {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('works-section').classList.add('active');
        } else if (tabName === 'reviews') {
            document.querySelectorAll('.tab')[2].classList.add('active');
            document.getElementById('reviews-section').classList.add('active');
        } else if (tabName === 'master') {
            const masterTab = document.getElementById('masterTab');
            if (masterTab) masterTab.classList.add('active');
            const masterSec = document.getElementById('master-section');
            if (masterSec) masterSec.classList.add('active');
        }
    }

    function setTime(t) {
        document.getElementById('newSlotTime').value = t;
    }

    async function loadData() {
        try {
            const res = await fetch('/api/data');
            appData = await res.json();
            checkAndRenderMasterPanel();
            renderUI();
        } catch (e) {
            console.error('Ошибка загрузки данных:', e);
        }
    }

    function checkAndRenderMasterPanel() {
        const userId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
        const isMaster = appData.master_ids && appData.master_ids.includes(userId);

        const tabsContainer = document.getElementById('tabsContainer');
        let masterTab = document.getElementById('masterTab');
        let masterSection = document.getElementById('master-section');

        if (isMaster) {
            if (!masterTab) {
                tabsContainer.innerHTML += `<div class="tab" id="masterTab" onclick="switchTab('master')">⚙️ Мастер</div>`;
            }
            if (!masterSection) {
                const container = document.querySelector('.container');
                const sectionDiv = document.createElement('div');
                sectionDiv.id = 'master-section';
                sectionDiv.className = 'section';
                sectionDiv.innerHTML = `
                    <div class="card">
                        <h3>➕ Добавить свободный сеанс</h3>
                        <input type="date" id="newSlotDate">
                        <div class="quick-time">
                            <div class="time-chip" onclick="setTime('11:00')">11:00</div>
                            <div class="time-chip" onclick="setTime('14:00')">14:00</div>
                            <div class="time-chip" onclick="setTime('17:00')">17:00</div>
                            <div class="time-chip" onclick="setTime('20:00')">20:00</div>
                        </div>
                        <input type="time" id="newSlotTime" value="12:30">
                        <button class="btn" onclick="addSlot()">Опубликовать слот</button>
                    </div>
                    <div class="card">
                        <h3>🖼 Загрузка работ (несколько сразу)</h3>
                        <!-- Атрибут multiple позволяет выбрать сразу пачку фотографий -->
                        <input type="file" id="workFiles" accept="image/*" multiple>
                        <button class="btn" onclick="addWorks()">Загрузить выбранные работы</button>
                    </div>
                    <div class="card">
                        <h3>📌 Активные записи и слоты</h3>
                        <div id="manageSlotsContainer" style="font-size: 13px; color: var(--text-secondary);">
                            Загрузка...
                        </div>
                    </div>
                `;
                container.appendChild(sectionDiv);
            }
        }
    }

    function renderUI() {
        if (appData.settings && appData.settings.studio_name) {
            document.getElementById('studioTitle').innerText = appData.settings.studio_name.toUpperCase();
        }

        // Слоты
        const slotsContainer = document.getElementById('slotsContainer');
        if (!appData.slots || appData.slots.length === 0) {
            slotsContainer.innerHTML = '<p style="color: var(--text-secondary); grid-column: span 2; text-align: center; padding: 20px;">Нет свободных окошек</p>';
        } else {
            slotsContainer.innerHTML = appData.slots.map(s => `
                <div class="slot-item ${s.is_booked ? 'booked' : ''}" ${!s.is_booked ? `onclick="selectSlot(${s.id}, '${s.date}', '${s.time}')"` : ''}>
                    <div class="slot-date">${s.date}</div>
                    <div class="slot-time">${s.time}</div>
                    <div class="slot-status" style="color: ${s.is_booked ? 'var(--accent)' : 'var(--success)'}">${s.is_booked ? 'Занято' : 'Свободно'}</div>
                </div>
            `).join('');
        }

        // Работы (портфолио)
        const worksContainer = document.getElementById('worksContainer');
        const isMaster = appData.master_ids && appData.master_ids.includes(window.Telegram?.WebApp?.initDataUnsafe?.user?.id);
        
        if (!appData.works || appData.works.length === 0) {
            worksContainer.innerHTML = '<p style="color: var(--text-secondary); grid-column: span 2; text-align: center; padding: 20px;">Портфолио пока пусто</p>';
        } else {
            worksContainer.innerHTML = appData.works.map(w => `
                <div class="work-card">
                    <img src="${w.image_url || w.url}" alt="Work" loading="lazy">
                    ${isMaster ? `<button class="delete-btn" onclick="deleteWork(${w.id})">×</button>` : ''}
                </div>
            `).join('');
        }

        // Отзывы
        const reviewsContainer = document.getElementById('reviewsContainer');
        if (!appData.reviews || appData.reviews.length === 0) {
            reviewsContainer.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 20px;">Пока нет отзывов</p>';
        } else {
            reviewsContainer.innerHTML = appData.reviews.map(r => `
                <div class="review-card">
                    <strong>${r.author}</strong>
                    <p>${r.text}</p>
                    ${r.photo_url || r.url ? `<img src="${r.photo_url || r.url}" style="margin-top:10px; border-radius:12px; width:100%; max-height:180px; object-fit:cover;">` : ''}
                </div>
            `).join('');
        }

        // Панель мастера (управление)
        const manageContainer = document.getElementById('manageSlotsContainer');
        if (manageContainer) {
            const bookedSlots = appData.slots.filter(s => s.is_booked);
            manageContainer.innerHTML = `
                <p style="margin-bottom: 8px; color: #fff;"><b>Занятые записи клиентов:</b></p>
                ${bookedSlots.length === 0 ? '<p style="margin-bottom: 14px; color: var(--text-secondary);">Нет активных записей</p>' : 
                    bookedSlots.map(s => `<div style="background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--glass-border);">
                        📅 <b>${s.date}</b> в ${s.time}<br>
                        👤 ${s.client_name} (<a href="https://t.me/${s.client_tg.replace('@','')}" target="_blank" style="color:var(--accent)">@${s.client_tg.replace('@','')}</a>)<br>
                        📐 ${s.tattoo_size}
                    </div>`).join('')}
                <p style="margin-top: 14px; margin-bottom: 8px; color: #fff;"><b>Все слоты в системе:</b></p>
                <div>
                    ${appData.slots.map(s => `<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; background: rgba(255,255,255,0.03); padding: 8px 12px; border-radius: 10px; border: 1px solid var(--glass-border);"><span>${s.date} ${s.time} (${s.is_booked ? 'Занято' : 'Свободно'})</span> <button style="background:var(--accent); color:#fff; border:none; padding:6px 12px; border-radius:8px; cursor:pointer; font-weight:600;" onclick="deleteSlot(${s.id})">Удалить</button></div>`).join('')}
                </div>
            `;
        }
    }

    function selectSlot(id, date, time) {
        selectedSlotId = id;
        document.getElementById('bookingFormCard').style.display = 'block';
        document.getElementById('selectedSlotInfo').innerText = `Выбрано время: ${date} в ${time}`;
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    async function addSlot() {
        const date = document.getElementById('newSlotDate').value;
        const time = document.getElementById('newSlotTime').value;
        if (!date || !time) return;
        
        const res = await fetch('/api/slots', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date, time })
        });
        if (res.ok) {
            document.getElementById('newSlotDate').value = '';
            loadData();
        }
    }

    async function deleteSlot(id) {
        if (!confirm('Удалить этот слот?')) return;
        const res = await fetch(`/api/slots/${id}`, { method: 'DELETE' });
        if (res.ok) loadData();
    }

    // Функция множественной загрузки работ
    async function addWorks() {
        const fileInput = document.getElementById('workFiles');
        if (fileInput.files.length === 0) {
            alert('Выберите хотя бы одно изображение!');
            return;
        }
        
        const formData = new FormData();
        for (let i = 0; i < fileInput.files.length; i++) {
            formData.append('files', fileInput.files[i]);
        }

        const res = await fetch('/api/works', { method: 'POST', body: formData });
        if (res.ok) {
            fileInput.value = '';
            loadData();
            alert('Работы успешно добавлены в портфолио!');
        } else {
            alert('Ошибка при загрузке работ');
        }
    }

    async function deleteWork(id) {
        if (!confirm('Удалить эту работу из портфолио?')) return;
        const res = await fetch(`/api/works/${id}`, { method: 'DELETE' });
        if (res.ok) loadData();
    }

    async function addReview() {
        const author = document.getElementById('reviewAuthor').value;
        const text = document.getElementById('reviewText').value;
        const photo = document.getElementById('reviewPhoto').files[0];

        if (!author || !text) {
            alert('Заполните имя и текст отзыва!');
            return;
        }

        const formData = new FormData();
        formData.append('author', author);
        formData.append('text', text);
        if (photo) formData.append('photo', photo);

        const res = await fetch('/api/reviews', { method: 'POST', body: formData });
        if (res.ok) {
            document.getElementById('reviewAuthor').value = '';
            document.getElementById('reviewText').value = '';
            document.getElementById('reviewPhoto').value = '';
            loadData();
            switchTab('reviews');
        }
    }

    async function submitBooking() {
        const clientName = document.getElementById('clientName').value;
        const clientTg = document.getElementById('clientTg').value;
        const tattooSize = document.getElementById('tattooSize').value;
        const photoFile = document.getElementById('tattooPhoto').files[0];

        if (!clientName || !clientTg || !tattooSize || !selectedSlotId) {
            alert('Пожалуйста, заполните все поля записи!');
            return;
        }

        const formData = new FormData();
        formData.append('slot_id', selectedSlotId);
        formData.append('client_name', clientName);
        formData.append('client_tg', clientTg);
        formData.append('tattoo_size', tattooSize);
        if (photoFile) formData.append('tattoo_photo', photoFile);

        const res = await fetch('/api/book', { method: 'POST', body: formData });
        if (res.ok) {
            alert('Запись успешно оформлена! Мастер получил уведомление.');
            document.getElementById('bookingFormCard').style.display = 'none';
            document.getElementById('clientName').value = '';
            document.getElementById('clientTg').value = '';
            document.getElementById('tattooSize').value = '';
            document.getElementById('tattooPhoto').value = '';
            loadData();
        } else {
            alert('Ошибка при бронировании слота');
        }
    }

    loadData();
</script>

</body>
</html>
